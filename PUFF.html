<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virtual Lounge TMA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --beer-gold: #f39c12;
            --foam-white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: white;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: none;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #app-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Beer Styles --- */
        .glass {
            width: 150px;
            height: 250px;
            border: 4px solid #fff;
            border-top: none;
            border-radius: 0 0 20px 20px;
            position: relative;
            overflow: hidden;
            display: none;
        }

        #liquid {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 90%;
            background: var(--beer-gold);
            transition: height 0.1s linear;
        }

        #foam {
            position: absolute;
            top: -20px;
            width: 100%;
            height: 40px;
            background: var(--foam-white);
            border-radius: 50%;
        }

        /* --- Vape/Cigarette Styles --- */
        #smoke-source {
            width: 40px;
            height: 150px;
            background: #444;
            border-radius: 5px;
            display: none;
            position: relative;
        }

        .vape-tip { width: 40px; height: 10px; background: #222; position: absolute; top: -10px; }

        /* --- Smoke Particles --- */
        .particle {
            position: absolute;
            background: rgba(200, 200, 200, 0.5);
            border-radius: 50%;
            pointer-events: none;
            filter: blur(8px);
        }

        /* --- Navigation --- */
        .nav {
            display: flex;
            background: #333;
            padding: 10px;
            justify-content: space-around;
        }

        button {
            padding: 10px;
            background: #555;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .active { background: #0088cc; }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="beer-glass" class="glass">
            <div id="liquid">
                <div id="foam"></div>
            </div>
        </div>

        <div id="vape-device" id="smoke-source">
            <div class="vape-tip"></div>
            <div style="padding: 20px 5px; text-align: center; font-size: 10px;">VAPE</div>
        </div>
    </div>

    <div class="nav">
        <button onclick="switchMode('beer')" id="btn-beer">Beer</button>
        <button onclick="switchMode('vape')" id="btn-vape">Vape</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let mode = 'beer';
        let beerLevel = 90;
        let isPressing = false;

        function switchMode(newMode) {
            mode = newMode;
            document.getElementById('beer-glass').style.display = newMode === 'beer' ? 'block' : 'none';
            document.getElementById('vape-device').style.display = newMode === 'vape' ? 'block' : 'none';
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${newMode}`).classList.add('active');
            
            // Request Permission for Motion on iOS
            if (newMode === 'beer' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission();
            }
        }

        // --- Beer Pouring Logic ---
        window.addEventListener('deviceorientation', (event) => {
            if (mode !== 'beer') return;
            
            // Adjusting for "pouring" angle (beta is front/back tilt)
            let tilt = event.beta; 
            if (tilt > 100 || tilt < -100) { // Device is upside down/tilted
                beerLevel -= 0.5;
                if (beerLevel < 0) beerLevel = 0;
                document.getElementById('liquid').style.height = beerLevel + "%";
            }
        });

        // --- Vape Smoke Logic ---
        const container = document.getElementById('app-container');

        function createSmoke() {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 40 + 20;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            
            // Center of screen
            p.style.left = (window.innerWidth / 2 - size / 2) + 'px';
            p.style.top = (window.innerHeight / 2) + 'px';
            
            container.appendChild(p);

            let opacity = 0.5;
            let scale = 1;
            let y = window.innerHeight / 2;

            const anim = setInterval(() => {
                opacity -= 0.01;
                scale += 0.02;
                y -= 2;
                p.style.opacity = opacity;
                p.style.transform = `scale(${scale})`;
                p.style.top = y + 'px';

                if (opacity <= 0) {
                    clearInterval(anim);
                    p.remove();
                }
            }, 20);
        }

        // Release "Vapor" burst on release
        window.addEventListener('touchstart', () => { isPressing = true; });
        window.addEventListener('touchend', () => { 
            if(mode === 'vape' && isPressing) {
                for(let i=0; i<15; i++) {
                    setTimeout(createSmoke, i * 50);
                }
            }
            isPressing = false;
        });

        // Default start
        switchMode('beer');
    </script>
</body>
</html>
