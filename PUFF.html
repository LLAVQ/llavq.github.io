<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virtual Lounge Pro 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --accent: #d4af37; --bg: #0a0a0a; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; touch-action: none; }
        canvas { position: absolute; top: 0; left: 0; z-index: 1; }
        .ui { position: relative; z-index: 10; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 40px 20px; box-sizing: border-box; pointer-events: none; }
        .controls { display: flex; flex-direction: column; align-items: center; gap: 20px; pointer-events: auto; }
        .nav { display: flex; gap: 15px; background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 30px; }
        .nav-item { font-size: 24px; cursor: pointer; }
        .main-btn { width: 110px; height: 110px; border-radius: 50%; border: 2px solid var(--accent); background: black; color: var(--accent); font-weight: bold; box-shadow: 0 0 20px rgba(212,175,55,0.2); }
    </style>
</head>
<body>

<canvas id="loungeCanvas"></canvas>

<div class="ui">
    <div style="text-align: center; pointer-events: auto;">
        <h1 id="item-title" style="margin:0; font-weight: 300;">CIGAR LOUNGE</h1>
        <div id="status" style="color: var(--accent); font-size: 14px;">Hold to Inhale</div>
    </div>

    <div class="controls">
        <div class="nav">
            <div class="nav-item" onclick="changeMode('Cigar')">🚬</div>
            <div class="nav-item" onclick="changeMode('Vape')">💨</div>
            <div class="nav-item" onclick="changeMode('Beer')">🍺</div>
        </div>
        <button class="main-btn" id="actionBtn">ACTION</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const canvas = document.getElementById('loungeCanvas');
    const ctx = canvas.getContext('2d');
    const actionBtn = document.getElementById('actionBtn');
    const statusText = document.getElementById('status');

    let mode = 'Cigar';
    let particles = [];
    let beerLevel = 0.7;
    let actionInterval;

    // --- AUDIO SYSTEM ---
    // Note: In a real app, replace these URLs with your own hosted .mp3 files
    const sounds = {
        inhale: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-fire-swoosh-2357.mp3'], volume: 0.5 }),
        exhale: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-wind-light-whoosh-1482.mp3'], volume: 0.8 }),
        gulp: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-swallow-liquid-single-2011.mp3'], volume: 0.6, loop: true }),
        sigh: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-human-sigh-of-relief-468.mp3'], volume: 0.7 })
    };

    function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', init);
    init();

    function changeMode(m) {
        mode = m;
        document.getElementById('item-title').innerText = m.toUpperCase() + " LOUNGE";
        actionBtn.innerText = (m === 'Beer') ? "DRINK" : "PUFF";
        tg.HapticFeedback.impactOccurred('medium');
    }

    function createSmoke(isExhale = false) {
        const count = isExhale ? 15 : 1; // More smoke on release
        for(let i=0; i<count; i++) {
            const p = {
                x: canvas.width / 2,
                y: canvas.height / 2,
                size: mode === 'Vape' ? 30 : 12,
                opacity: 0.8,
                vx: (Math.random() - 0.5) * (isExhale ? 10 : 2)
            };
            anime({
                targets: p,
                x: p.x + p.vx * 50,
                y: p.y - 600,
                size: p.size * 6,
                opacity: 0,
                duration: isExhale ? 2000 : 4000,
                easing: 'easeOutCubic',
                begin: () => particles.push(p),
                complete: () => particles = particles.filter(item => item !== p)
            });
        }
    }

    // --- INPUT LOGIC ---
    actionBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (mode === 'Beer') {
            if (beerLevel > 0.1) {
                sounds.gulp.play();
                actionInterval = setInterval(() => {
                    beerLevel -= 0.005;
                    tg.HapticFeedback.impactOccurred('light');
                    if (beerLevel <= 0.1) stopAction();
                }, 100);
            }
        } else {
            sounds.inhale.play();
            actionInterval = setInterval(createSmoke, 150);
            tg.HapticFeedback.impactOccurred('medium');
        }
    });

    actionBtn.addEventListener('touchend', stopAction);

    function stopAction() {
        clearInterval(actionInterval);
        if (mode === 'Beer') {
            sounds.gulp.stop();
            sounds.sigh.play();
        } else {
            sounds.inhale.stop();
            sounds.exhale.play();
            createSmoke(true); // Big smoke burst on release
        }
        tg.HapticFeedback.notificationOccurred('success');
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (mode === 'Beer') {
            ctx.fillStyle = '#f39c12';
            const surfaceY = canvas.height * (1 - beerLevel);
            ctx.beginPath();
            ctx.moveTo(0, surfaceY); ctx.lineTo(canvas.width, surfaceY);
            ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(0, canvas.height);
            ctx.fill();
            // Foam
            ctx.fillStyle = 'white'; ctx.globalAlpha = 0.5;
            ctx.fillRect(0, surfaceY - 5, canvas.width, 10); ctx.globalAlpha = 1;
        }
        particles.forEach(p => {
            ctx.globalAlpha = p.opacity;
            ctx.fillStyle = mode === 'Vape' ? '#fff' : '#999';
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        });
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
