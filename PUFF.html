<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Realistic Lounge 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #0f0f0f; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; }
        canvas { position: absolute; top: 0; left: 0; }
        .ui { position: relative; z-index: 10; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 30px; box-sizing: border-box; pointer-events: none; }
        .controls { pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .puff-btn { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #d4af37; background: black; color: #d4af37; font-weight: bold; cursor: pointer; box-shadow: 0 0 20px rgba(212,175,55,0.3); }
        .nav { pointer-events: auto; display: flex; gap: 10px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 20px; }
        .nav-item { cursor: pointer; padding: 10px; border-radius: 10px; transition: 0.3s; }
        .nav-item:hover { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="ui">
    <div style="text-align: center;">
        <h1 id="title" style="margin:0; font-weight: 300;">Cigar Lounge</h1>
        <p id="status" style="color: #d4af37; font-size: 14px;">Hold to Inhale</p>
    </div>

    <div class="controls">
        <div class="nav">
            <div class="nav-item" onclick="changeMode('Cigar')">🚬</div>
            <div class="nav-item" onclick="changeMode('Vape')">💨</div>
            <div class="nav-item" onclick="changeMode('Beer')">🍺</div>
        </div>
        <button class="puff-btn" id="mainAction">Puff</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let mode = 'Cigar';
    let tilt = 0;

    // Set canvas size
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Tilt Logic (Realistic Liquid)
    window.addEventListener('deviceorientation', (e) => {
        // Smooth tilt using Anime.js to "settle" the liquid
        anime({
            targets: { val: tilt },
            val: e.gamma / 50,
            duration: 500,
            easing: 'easeOutElastic(1, .6)',
            update: (anim) => { tilt = anim.animatables[0].target.val; }
        });
    });

    function changeMode(newMode) {
        mode = newMode;
        document.getElementById('title').innerText = newMode + " Lounge";
        particles = [];
    }

    // Realistic Smoke with Anime.js
    function createSmoke() {
        const smoke = {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2,
            size: mode === 'Vape' ? 40 : 15,
            opacity: 0.8,
            drift: (Math.random() - 0.5) * 100
        };

        // The "Secret Sauce": Animate the smoke object itself
        anime({
            targets: smoke,
            x: smoke.x + smoke.drift + (tilt * 200),
            y: smoke.y - 400,
            size: smoke.size * 5,
            opacity: 0,
            duration: mode === 'Vape' ? 3000 : 5000,
            easing: 'easeOutQuart',
            begin: () => particles.push(smoke),
            complete: () => {
                particles = particles.filter(p => p !== smoke);
            }
        });
    }

    // Interaction
    const btn = document.getElementById('mainAction');
    let interval;
    btn.addEventListener('touchstart', () => {
        interval = setInterval(createSmoke, 100);
        document.getElementById('status').innerText = "Inhaling...";
    });
    btn.addEventListener('touchend', () => {
        clearInterval(interval);
        document.getElementById('status').innerText = "Exhaling...";
    });

    // Render Loop
    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Liquid
        if (mode === 'Beer') {
            ctx.fillStyle = '#f39c12';
            ctx.beginPath();
            let level = canvas.height * 0.7;
            ctx.moveTo(0, level + (tilt * 100));
            ctx.lineTo(canvas.width, level - (tilt * 100));
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();
        }

        // Draw Smoke
        particles.forEach(p => {
            ctx.globalAlpha = p.opacity;
            ctx.fillStyle = mode === 'Vape' ? '#fff' : '#aaa';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        });

        requestAnimationFrame(render);
    }
    render();

</script>
</body>
</html>
